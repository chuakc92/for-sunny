<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Card</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d9c7bd;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    padding: 20px;
  }
  .card {
    width: 820px;
    height: 480px;
    background: linear-gradient(160deg, #fff5ef 0%, #ffe9f0 55%, #fff0e6 100%);
    border-radius: 0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 56px;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.5;
  }
  .blob1 { width: 160px; height: 160px; background: #ffd6e6; top: -50px; left: -40px; }
  .blob2 { width: 130px; height: 130px; background: #ffe4c9; bottom: -40px; right: -30px; }
  .blob3 { width: 90px; height: 90px; background: #ffe0ec; bottom: 90px; left: -30px; }

  .emoji-top {
    font-size: 28px;
    margin-bottom: 4px;
    position: relative;
  }
  .title {
    font-family: 'Caveat', cursive;
    font-size: 34px;
    font-weight: 700;
    color: #e26d8a;
    line-height: 1.05;
    margin-bottom: 8px;
    position: relative;
  }
  .divider {
    width: 54px;
    height: 3px;
    border-radius: 3px;
    background: #f0b9c9;
    margin: 0 auto 14px;
    position: relative;
  }
  .body {
    font-family: 'Gaegu', 'Nunito', sans-serif;
    font-size: 18px;
    line-height: 1.8;
    color: #7a5a63;
    font-weight: 700;
    max-width: 660px;
    position: relative;
  }
  .korean {
    font-size: 17px;
  }
  .hearts-line {
    margin: 6px 0;
  }
  .signoff {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: #e26d8a;
    margin-top: 14px;
    position: relative;
  }
  .hearts {
    position: absolute;
    font-size: 18px;
    opacity: 0.6;
  }
  .h1 { top: 40px; right: 50px; }
  .h2 { top: 140px; left: 46px; font-size: 13px; }
  .h3 { bottom: 50px; right: 44px; font-size: 14px; }
  .h4 { bottom: 120px; left: 60px; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <span class="hearts h1">☕</span>
    <span class="hearts h2">🎻</span>
    <span class="hearts h3">💗</span>
    <span class="hearts h4">🌸</span>

    <div class="emoji-top">☀️</div>
    <div class="title">My Sunny</div>
    <div class="divider"></div>
    <div class="body">
      <span class="korean">네가 얼마나 열심히 하고 있는지 다 알아 ☺️</span><br><br>
      I know how hard you've been working and I just wanted you<br>
      to know, flowers or not, that I'll always be here cheering you on ☺️<br><br>
      <span class="hearts-line">I miss you 💗 Stay strong 💗 You got this 💗 See you in a few days 💗</span><br><br>
      화이팅!!
    </div>
    <div class="signoff">Your KC ☺️</div>
  </div>

  <button onclick="downloadCard()"
    style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    padding:16px 32px;border:none;border-radius:50px;background:#e26d8a;color:#fff;
    font-family:sans-serif;font-size:18px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);z-index:99;">
    ⬇️ Download card as PNG
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    function downloadCard() {
      const card = document.querySelector('.card');
      html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'coffee-card-for-sunny.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
