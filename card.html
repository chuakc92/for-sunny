<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d9c7bd;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    padding: 20px;
  }
  /* wide landscape card ratio to match gift frame */
  .card {
    width: 820px;
    height: 440px;
    background: linear-gradient(160deg, #fff5ef 0%, #ffe9f0 55%, #fff0e6 100%);
    border-radius: 0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 56px;
  }
  /* soft decorative blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.5;
  }
  .blob1 { width: 160px; height: 160px; background: #ffd6e6; top: -50px; left: -40px; }
  .blob2 { width: 130px; height: 130px; background: #ffe4c9; bottom: -40px; right: -30px; }
  .blob3 { width: 90px; height: 90px; background: #ffe0ec; bottom: 90px; left: -30px; }

  .sun {
    font-size: 24px;
    margin-bottom: 2px;
    position: relative;
  }
  .flower {
    font-size: 40px;
    line-height: 1;
    margin: 2px 0 8px;
    position: relative;
    filter: drop-shadow(0 8px 12px rgba(220,120,150,0.25));
  }
  .title {
    font-family: 'Caveat', cursive;
    font-size: 34px;
    font-weight: 700;
    color: #e26d8a;
    line-height: 1.05;
    margin-bottom: 8px;
    position: relative;
  }
  .divider {
    width: 54px;
    height: 3px;
    border-radius: 3px;
    background: #f0b9c9;
    margin: 0 auto 12px;
    position: relative;
  }
  .body {
    font-family: 'Gaegu', 'Nunito', sans-serif;
    font-size: 18px;
    line-height: 1.7;
    color: #7a5a63;
    font-weight: 700;
    max-width: 660px;
    position: relative;
  }
  .signoff {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    color: #e26d8a;
    margin-top: 12px;
    position: relative;
  }
  .hearts {
    position: absolute;
    font-size: 18px;
    opacity: 0.6;
  }
  .h1 { top: 54px; right: 50px; }
  .h2 { top: 120px; left: 46px; font-size: 13px; }
  .h3 { bottom: 60px; right: 44px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <span class="hearts h1">💗</span>
    <span class="hearts h2">🤍</span>
    <span class="hearts h3">🌸</span>

    <div class="sun">☀️</div>
    <div class="flower">🌸</div>
    <div class="title">For my Sunny</div>
    <div class="divider"></div>
    <div class="body">
      슬퍼하지 마, 알았지? 꽃은 언젠가 다 시들지만 그건 슬픈 게 아니야.<br>
      영원하지 않은 게 바로 꽃의 마법이거든.<br>
      피어있는 동안만큼은 멀리 있는 내가 널 계속 생각한다는 걸 알려주니까.<br>
      질 때마다 난 또 새 꽃으로 그 마음을 전할게.<br>
      네가 내 품에 안기는 그날까지, 이 꽃들이 내 대신 네 곁을 지켜줄게.<br>
      얼른 보고 싶어 🥹
    </div>
    <div class="signoff">언제나 너의 KC ❤️</div>
  </div>

  <button onclick="downloadCard()"
    style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    padding:16px 32px;border:none;border-radius:50px;background:#e26d8a;color:#fff;
    font-family:sans-serif;font-size:18px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);z-index:99;">
    ⬇️ Download card as PNG
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    function downloadCard() {
      const card = document.querySelector('.card');
      html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'card-for-sunny.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
