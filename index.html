<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="For Sunny ☀️">
    <meta name="theme-color" content="#fff0f5">
    <title>For Sunny ☀️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Locked Countdown Page (shows before Aug 23) -->
        <section id="locked-page" class="landing">
            <div class="landing-content">
                <div class="sun-icon">☀️</div>
                <h1 class="landing-title">For My <span class="highlight">Sunny</span></h1>
                <p class="landing-subtitle">Something's waiting for you...</p>
                <div class="countdown-display">
                    <div id="countdown-timer" style="font-family:'Caveat',cursive; font-size:2.2rem; color:#ff6b9d; font-weight:700;"></div>
                    <span id="countdown-label" style="font-size:0.85rem;">until you can open this</span>
                </div>
                <button class="locked-btn" id="locked-btn" onclick="tapLocked()">🔒</button>
                <p class="locked-message" id="locked-message"></p>
            </div>
            <div class="floating-hearts">
                <span>💗</span><span>🌸</span><span>✨</span><span>💗</span><span>☀️</span>
            </div>
        </section>

        <!-- Landing Page (shows on/after Aug 23) -->
        <section id="landing" class="landing hidden">
            <div class="landing-content">
                <div class="sun-icon">☀️</div>
                <h1 class="landing-title">For My <span class="highlight">Sunny</span></h1>
                <p class="landing-subtitle">June 11 → August 23</p>
                <p class="landing-desc">A little something to keep you company on your flight home to me ✈️</p>
                <div class="countdown-display">
                    <span id="countdown-text">The wait is over ☺️</span>
                </div>
                <button class="enter-btn" onclick="enterApp()">Open ☺️</button>
            </div>
            <div class="floating-hearts">
                <span>💗</span><span>🌸</span><span>✨</span><span>💗</span><span>☀️</span>
            </div>
        </section>

        <!-- Main Envelope Grid -->
        <section id="envelopes" class="envelopes-section hidden">
            <div class="envelopes-header">
                <h2>Open When... 💌</h2>
                <p class="progress-text"><span id="opened-count">0</span> / 10 opened</p>
            </div>
            <div class="envelope-grid">
                <!-- Envelope cards generated by JS -->
            </div>
        </section>

        <!-- Envelope Content Modal -->
        <div id="envelope-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>

        <!-- Password Prompt -->
        <div id="password-modal" class="modal hidden">
            <div class="password-content">
                <div class="lock-icon">🔒</div>
                <h3 id="password-question"></h3>
                <p class="password-hint" id="password-hint"></p>
                <input type="text" id="password-input" placeholder="Type your answer..." autocomplete="off" autocapitalize="none">
                <button class="unlock-btn" onclick="checkPassword()">Unlock 💗</button>
                <p id="password-error" class="password-error hidden">Try again, 자기야 😤</p>
                <button class="back-btn" onclick="closePasswordModal()">← Back</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <script src="confetti.min.js"></script>
    <script src="app.js"></script>
    <script>
        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
